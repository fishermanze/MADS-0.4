server.port=8080
management.server.port=8081
management.endpoints.jmx.exposure.include=*
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
# Disable external middleware health probes during local integration testing.
management.health.mongo.enabled=true
management.health.rabbit.enabled=false
management.health.redis.enabled=false
management.health.elasticsearch.enabled=false
spring.data.mongodb.uri=${MADS_MONGODB_URI:mongodb://localhost:27017/mads_chat}
spring.data.mongodb.auto-index-creation=true

# --- MySQL (Phase 2 用户 / 鉴权) ---
spring.datasource.url=${MADS_DATASOURCE_URL:jdbc:mysql://localhost:3306/mads_auth?createDatabaseIfNotExist=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${MADS_DATASOURCE_USERNAME:root}
spring.datasource.password=${MADS_DATASOURCE_PASSWORD:1234}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

mads.jwt.secret=${MADS_JWT_SECRET:MADS_Dev_Jwt_Secret_Change_Me_Use_Long_Random_String_2026}
mads.jwt.expiration-seconds=${MADS_JWT_EXPIRATION_SECONDS:86400}
mads.auth.bootstrap-admin-username=${MADS_BOOTSTRAP_ADMIN_USER:admin}
mads.auth.bootstrap-admin-password=${MADS_BOOTSTRAP_ADMIN_PASSWORD:admin123}
mads.auth.otp-ttl-seconds=300

mads.autogen.gateway-url=http://127.0.0.1:9001/autogen/generate
mads.autogen.gateway-stream-url=http://127.0.0.1:9001/autogen/generate/stream
mads.autogen.router-enabled=true
mads.autogen.blocking-max-rounds=1
# 调度器模式下 stream-max-rounds 是"硬安全帽"(防 runaway), 实际由 convergence/僵局检测提前停止
mads.autogen.stream-max-rounds=18
mads.autogen.blocking-timeout-seconds=90
# 流式总超时拉到 15min, 给收敛足够时间; 单角色超时由 Python MADS_AGENT_RUN_TIMEOUT_SECONDS 控制(默认 60s)
mads.autogen.stream-timeout-seconds=900
# 自研调度器策略: none(关) | heuristic | llm | hybrid(默认)
mads.autogen.router-strategy=hybrid
mads.autogen.convergence-threshold=0.55


